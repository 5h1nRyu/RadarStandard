<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>交互式雷达图布局</title>
  <!-- 引入Interact.js库 -->
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@800&display=swap" rel="stylesheet">
  <style>
    @import url("https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/harmonyos-sans/1.1.0/style.css");
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0a0a0a url("./pic/bg.jpg") center center / cover no-repeat fixed;
      color: #eaeaea;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 横式单进度条组件 */
    .controls-container {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 320px;
      height: 110px;
      background: rgba(20, 20, 30, 0.85);
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      padding: 15px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .controls-container.global {
      top: 150px;
    }

    /* 雷达图容器 - 初始固定大小 */
    .radar-container {
      position: fixed;
      top: 120px;
      left: 900px;
      width: 800px;
      height: 500px;
      background: rgba(18, 22, 34, 0);
      border-radius: 12px;
      border: 2px solid rgba(170, 190, 255, 0.25);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }



    .radar-bg-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.14;
    }

    .radar-bg-logo {
      max-width: 50%;
      max-height: 30%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .radar-bg-text {
      max-width: 100%;
      text-align: center;
      font-family: "M PLUS 1p", "HarmonyOS Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-weight: 700;
      font-size: clamp(12px, 42px, 56px);
      color: #f1f4ff;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 选手信息面板 - 初始固定大小 */
    .player-info-container {
      position: fixed;
      top: 100px;
      left: 500px;
      width: 400px;
      height: 150px;
      background: rgba(25, 25, 35, 0.85);
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      padding: 15px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .player-rank-container {
      position: fixed;
      top: 260px;
      left: 500px;
      width: 400px;
      height: 110px;
      background: rgba(25, 25, 35, 0.85);
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      padding: 8px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      font-family: "M PLUS 1p", "HarmonyOS Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-weight: 700;
    }



    .player-rank-images-container {
      position: fixed;
      top: 380px;
      left: 500px;
      width: 400px;
      height: 110px;
      background: rgba(25, 25, 35, 0.85);
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      padding: 8px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 6px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .player-rank-images {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      align-items: stretch;
    }

    .player-rank-image-item {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(180, 200, 255, 0.18);
      background: rgba(18, 22, 34, 0.35);
    }

    .player-rank-image-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 图片展示面板 */
    .image-display-container {
      position: fixed;
      top: 300px;
      left: 40px;
      width: 360px;
      height: 240px;
      background: rgba(18, 22, 34, 0);
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      padding: 14px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .image-display-title,
    .text-display-title {
      color: #d4d8ff;
      font-size: 14px;
      letter-spacing: 1px;
      border-bottom: 1px solid #32374a;
      padding-bottom: 6px;
    }

    .image-display-content {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 6px;
      background: rgba(18, 22, 34, 0);
      /*border: 1px solid rgba(180, 200, 255, 0.18);*/
      backdrop-filter: blur(8px);
    }

    .image-display-content img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Icon 组件（基于图片组件精简） */
    .icon-display-container {
      background: rgba(20, 24, 36, 0.35);
      border: 1px solid rgba(180, 200, 255, 0.18);
      border-radius: 8px;
      padding: 4px;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
      gap: 0;
    }

    .icon-display-container .image-display-content {
      border-radius: 6px;
      background: rgba(8, 12, 20, 0.22);
      backdrop-filter: blur(8px);
    }

    /* 文字展示面板 */
    .text-display-container {
      position: fixed;
      top: 300px;
      left: 440px;
      width: 360px;
      height: 220px;
      background: rgba(20, 20, 30, 0.9);
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      padding: 14px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .text-display-content {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      text-align: center;
      color: #f1f4ff;
      line-height: 1.35;
      white-space: pre;
      word-break: normal;
      overflow: hidden;
      font-family: "M PLUS 1p", "HarmonyOS Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-weight: 700;
    }

    .text-display-container.vertical {
      width: 180px;
      height: 360px;
    }

    .text-display-container.vertical .text-display-content {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 2px;
      line-height: 1.2;
      white-space: normal;
      word-break: break-all;
      padding: 10px 6px;
    }

    /* 竖式进度条组件 */
    .vertical-progress-container {
      position: fixed;
      top: 20px;
      left: 360px;
      width: 120px;
      height: 240px;
      background: rgba(20, 20, 30, 0.85);
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      padding: 14px 10px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .vertical-progress-container.global {
      left: 500px;
    }

    .vertical-progress-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center
    }

    .v-bar {
      width: 6px;
      flex: 1;
      min-height: 0;
      border-radius: 999px;
      background: rgba(90, 110, 170, 0.2);
      overflow: hidden;
      display: flex;
      align-items: flex-start;
    }

    .v-fill {
      width: 100%;
      height: 0%;
      background: rgba(235, 242, 255, 0.82);
      transition: height 80ms linear;
    }

    .v-label {
      color: #aaa;
      font-size: 12px;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 1px;
    }

    /* 拖拽手柄样式 */
    .drag-handle {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 20px;
      height: 20px;
      cursor: move;
      color: #888;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .resize-handle {
      position: absolute;
      bottom: 5px;
      right: 5px;
      width: 15px;
      height: 15px;
      cursor: nwse-resize;
      border-right: 2px solid #666;
      border-bottom: 2px solid #666;
    }

    /* 标题和按钮样式 */
    h3 {
      color: #eaeaea;
      font-size: 18px;
      margin-bottom: 5px;
      padding-bottom: 8px;
      border-bottom: 1px solid #333;
    }

    .button-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .control-btn {
      background: rgba(60, 76, 130, 0.35);
      backdrop-filter: blur(10px);
      color: #eaeaea;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
      min-width: 80px;
    }

    .control-btn:hover {
      background: rgba(80, 98, 155, 0.42);
      border-color: #666;
    }

    .control-btn.active {
      background: rgba(102, 132, 235, 0.55);
      border-color: #6a7bc8;
    }

    .player-name {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 5px;
    }

    .player-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      font-size: 12px;
    }

    .stat-item {
      background: rgba(45, 58, 88, 0.38);
      border: 1px solid rgba(180, 200, 255, 0.18);
      backdrop-filter: blur(8px);
      padding: 6px;
      border-radius: 5px;
      text-align: center;
    }

    .stat-label {
      color: #fff;
      font-size: 10px;
    }

    .stat-value {
      color: #fff;
      font-weight: bold;
      font-size: 13px;
    }

    .player-rank-container .player-stats {
      flex: 1;
      min-height: 0;
      width: 100%;
      gap: 8px;
      align-items: stretch;
    }

    .player-rank-container .stat-item {
      padding: 3px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      height: 100%;
      min-height: 0;
    }

    .player-rank-container .stat-label {
      font-size: clamp(10px, 0.85vw, 14px);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      line-height: 1;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .player-rank-container .stat-value {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
      min-width: 0;
      text-align: left;
      flex: 1;
    }

    .player-rank-container .rank-main {
      font-size: clamp(22px, 2.1vw, 40px);
      font-weight: 800;
      color: #ffffff;
    }

    .player-rank-container .rank-mainG {
      color: gold;
      text-shadow:
              0 0 5px #f5ae1f,
              0 0 10px #f5ae1f,
              0 0 20px #f5ae1f;
    }

    .player-rank-container .rank-mainS {
      color: silver;
      text-shadow:
              0 0 5px #8f8f8f,
              0 0 10px #8f8f8f,
              0 0 20px #8f8f8f;
    }

    .player-rank-container .rank-mainB {
      color: rgb(221, 148, 74);
      text-shadow:
              0 0 5px rgb(205, 127, 50),
              0 0 10px rgb(205, 127, 50),
              0 0 20px rgb(205, 127, 50);
    }

    .player-rank-container .rank-total {
      margin-top: 3px;
      font-size: clamp(12px, 0.7vw, 16px);
      font-weight: 500;
      color: rgba(220, 228, 255, 0.82);
      align-self: flex-end;
    }

    /* 进度条样式 */
    .progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bar {
      width: 100%;
      height: 6px;
      background: rgba(90, 110, 170, 0.2);
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      width: 0%;
      height: 100%;
      background: rgba(235, 242, 255, 0.82);
      transition: width 80ms linear;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #aaa;
    }

    #radarCanvas {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      display: block;
      position: relative;
      z-index: 1;
    }

    /* 开场遮罩层 */
    #introOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 1);
      backdrop-filter: blur(16px);
      z-index: 20;
      display: grid;
      place-items: center;
      transition: opacity 600ms ease;
    }

    #introOverlay::after {
      content: "按空格键开始";
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.55);
      animation: pulse 1.8s infinite;
      font-size: 1.25rem;
    }

    #introOverlay.started { opacity: 0; pointer-events: none; }

    @keyframes pulse {
      0%, 100% { opacity: 0.28; }
      50% { opacity: 0.85; }
    }

    /* 布局控制按钮 */
    .layout-controls {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .layout-btn {
      background: rgba(45, 56, 88, 0.45);
      backdrop-filter: blur(10px);
      color: #eaeaea;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px 15px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .layout-btn:hover {
      background: rgba(68, 86, 132, 0.5);
    }

    .layout-controls.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .panel-entering {
      animation-duration: 2600ms;
      animation-timing-function: ease;
      animation-delay: var(--entry-delay, 0ms);
      animation-fill-mode: both;
      will-change: opacity, translate;
    }

    .panel-enter-fade {
      animation-name: panelEnterFade;
    }

    .panel-enter-slide-left {
      animation-name: panelEnterSlideLeft;
    }

    .panel-enter-slide-right {
      animation-name: panelEnterSlideRight;
    }

    @keyframes panelEnterFade {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    @keyframes panelEnterSlideLeft {
      0% {
        opacity: 0;
        translate: -80px 0;
      }
      80% {
        opacity: 1;
        translate: 40px 0;
      }
      100% {
        opacity: 1;
        translate: 0 0;
      }
    }

    @keyframes panelEnterSlideRight {
      0% {
        opacity: 0;
        translate: 80px 0;
      }
      80% {
        opacity: 1;
        translate: -40px 0;
      }
      100% {
        opacity: 1;
        translate: 0 0;
      }
    }
  </style>
</head>
<body>
<div id="introOverlay"></div>

<!-- 布局控制按钮 -->
<div class="layout-controls">
  <button class="layout-btn" id="resetLayoutBtn">重置布局</button>
  <button class="layout-btn" id="toggleDragBtn">拖拽模式</button>
  <button class="layout-btn" id="exportLayoutBtn">导出当前布局</button>
</div>

<!-- 控制面板 -->
<div class="controls-container layout-panel" id="controlsItemContainer" data-default-width="320" data-default-height="110">
  <div class="progress-wrap">
    <div class="bar"><div id="itemBar" class="fill"></div></div>
  </div>
</div>

<!-- 横式总进度组件 -->
<div class="controls-container global layout-panel" id="controlsGlobalContainer" data-default-width="320" data-default-height="110">
  <div class="progress-wrap">
    <div class="bar"><div id="globalBar" class="fill"></div></div>
  </div>
</div>

<!-- 竖式当前进度组件 -->
<div class="vertical-progress-container layout-panel" id="verticalItemProgressContainer" data-default-width="120" data-default-height="240">
  <div class="vertical-progress-wrap">
    <div class="v-bar"><div id="itemBarVertical" class="v-fill"></div></div>
  </div>
</div>

<!-- 竖式总进度组件 -->
<div class="vertical-progress-container global layout-panel" id="verticalGlobalProgressContainer" data-default-width="120" data-default-height="240">
  <div class="vertical-progress-wrap">
    <div class="v-bar"><div id="globalBarVertical" class="v-fill"></div></div>
  </div>
</div>

<!-- 雷达图容器 -->
<div class="radar-container layout-panel" id="radarContainer" data-default-width="500" data-default-height="500">
  <!--    <div class="drag-handle">☰</div>-->
  <div class="radar-bg-overlay" aria-hidden="true">
    <img class="radar-bg-logo" src="./pic/logo-column-white.svg" alt="" />
    <div class="radar-bg-text">25-26赛季 赛季通算</div>
  </div>
  <canvas id="radarCanvas" width="1200" height="1200"></canvas>
</div>

<!-- 选手信息面板 -->
<div class="player-info-container layout-panel" id="playerInfoContainer" data-default-width="400" data-default-height="150">
  <!--    <div class="drag-handle">☰</div>-->
  <div class="player-name" id="playerName">猿川真寿</div>
  <div class="player-stats" id="playerStats">
    <!-- 动态生成统计项 -->
  </div>
</div>

<!-- 选手排名面板 -->
<div class="player-rank-container layout-panel" id="playerRankContainer" data-default-width="400" data-default-height="110">
  <div class="player-stats" id="playerRanks">
    <!-- 动态生成排名项 -->
  </div>
</div>

<!-- 排名图片面板 -->
<div class="player-rank-images-container layout-panel" id="playerRankImagesContainer" data-default-width="400" data-default-height="110">
  <div class="player-rank-images" id="playerRankImages"></div>
</div>

<!-- 图片展示面板 -->
<div class="image-display-container layout-panel" id="imageDisplayContainer" data-default-width="360" data-default-height="240">
  <!--    <div class="drag-handle">☰</div>-->
  <div class="image-display-content">
    <img src="./pic/1.png" alt="展示图片" />
  </div>
</div>

<div class="image-display-container layout-panel" id="imageDisplayContainer" data-default-width="360" data-default-height="240">
  <!--    <div class="drag-handle">☰</div>-->
  <div class="image-display-content">
    <img src="./pic/2.png" alt="展示图片" />
  </div>
</div>

<div class="image-display-container icon-display-container layout-panel" id="iconDisplayContainer" data-default-width="360" data-default-height="240">
  <!--    <div class="drag-handle">☰</div>-->
  <div class="image-display-content">
    <img src="./pic/7.png" alt="展示icon" />
  </div>
</div>

<!-- 文字展示面板 -->
<div class="text-display-container layout-panel" id="textDisplayContainer" data-default-width="360" data-default-height="220">
  <!--    <div class="drag-handle">☰</div>-->
  <div class="text-display-content" id="textDisplayContent">胜又健志</div>
</div>

<div class="text-display-container layout-panel" id="textDisplayContainer" data-default-width="360" data-default-height="220">
  <!--    <div class="drag-handle">☰</div>-->
  <div class="text-display-content" id="textDisplayContent">风林火山</div>
</div>

<div class="text-display-container layout-panel" id="textDisplayContainer" data-default-width="360" data-default-height="220">
  <!--    <div class="drag-handle">☰</div>-->
  <div class="text-display-content" id="textDisplayContent">队标</div>
</div>

<div class="text-display-container vertical layout-panel" id="textDisplayVerticalContainer" data-default-width="180" data-default-height="360">
  <div class="text-display-content" id="textDisplayVerticalContent">选手卡片</div>
</div>

<script>
  // =============================
  // 雷达图可视化与交互逻辑（JS 主体）
  // =============================

  // 定义全局配置对象：集中管理维度名、范围、动画时长等常量，便于统一维护。
  const CONFIG = {

  // 将数值限制在 [min, max] 区间，防止越界。
  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  // 三次缓动函数：让过渡前后更平滑，中间更快。
  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  // 使用原始分数计算半径比。
  function normalize(value, i) {
    const min = CONFIG.MIN_SCORES[i];
    const max = CONFIG.BASE_MAX_SCORES[i];
    return (value - min) / (max - min);
  }

  // 按维度格式化显示值，和统计面板保持一致的可读性。
  function formatRadarValue(value, i) {
    if (typeof value !== "number" || Number.isNaN(value)) return `${value}`;
    // 概率类维度显示百分比，其余显示数值。
    if (i === 1 || i === 2 || i === 3) return `${(value * 100).toFixed(0)}%`;
    if (i === 6 || i === 7 || i === 0) return value.toFixed(1);
    return value.toFixed(0);
  }

  // 依据归一化结果返回标签色。
  function getRadarLabelColor(norm) {
    if (norm >= 1.1999)  return "#ffd976";
    return "#ffffff";
  }

  function getMinScoreBaseline() {
    return [...CONFIG.MIN_SCORES];
  }

  // 线性插值：a 到 b 按 t（0~1）插值。
  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  // 将数值吸附到最近的网格点。
  function snapToGrid(value) {
    return Math.round(value / SNAP_GRID_SIZE) * SNAP_GRID_SIZE;
  }

  // 让组件提升到当前最上层，并保持该层级。
  function bringPanelToFront(panelEl) {
    if (!panelEl) return;
    highestPanelZIndex += 1;
    panelEl.style.zIndex = String(highestPanelZIndex);
  }

  // 初始化最高层级：基于当前页面已有面板 z-index 计算。
  function initHighestPanelZIndex() {
    let maxZ = 5;
    layoutPanels().forEach((panel) => {
      const z = parseInt(window.getComputedStyle(panel).zIndex, 10);
      if (Number.isFinite(z)) maxZ = Math.max(maxZ, z);
    });
    highestPanelZIndex = maxZ;
  }

  // 为每个布局面板生成稳定且唯一的 key。
  // 允许新增图片/文字组件时不必手工维护 id，避免多个组件状态互相覆盖。
  function ensurePanelKeys() {
    const usedKeys = new Set();
    layoutPanels().forEach((panel, index) => {
      const base = panel.dataset.panelKey || panel.id || `layout-panel-${index + 1}`;
      let key = base;
      let suffix = 2;
      while (usedKeys.has(key)) {
        key = `${base}-${suffix++}`;
      }
      panel.dataset.panelKey = key;
      usedKeys.add(key);
    });
  }

  // 文本预处理：
  // 1) 含 '/' 时移除该字符并在该处换行；
  // 2) 不含 '/' 时强制为单行文本；
  // 处理后的换行固定，不随组件尺寸变化。
  function preprocessText(contentEl) {
    const raw = contentEl.dataset.rawText ?? contentEl.textContent.trim();
    contentEl.dataset.rawText = raw;
    const hasSlash = raw.includes('/');
    const processed = hasSlash ? raw.replaceAll('/', '\n') : raw.replace(/\s*\n+\s*/g, ' ');
    contentEl.textContent = processed;
    contentEl.style.whiteSpace = 'pre';
  }

  // 让指定文字节点在容器中自适应：自动寻找可完整显示的最大字号。
  function fitTextElement(contentEl) {
    const parent = contentEl.parentElement;
    if (!parent) return;

    const maxW = parent.clientWidth - 20;
    const maxH = parent.clientHeight - 16;
    if (maxW <= 0 || maxH <= 0) return;

    let low = 10;
    let high = 128;
    let best = low;

    while (low <= high) {
      const mid = Math.floor((low + high) / 2);
      contentEl.style.fontSize = `${mid}px`;
      if (contentEl.scrollWidth <= maxW && contentEl.scrollHeight <= maxH) {
        best = mid;
        low = mid + 1;
      } else {
        high = mid - 1;
      }
    }

    contentEl.style.fontSize = `${best}px`;
  }

  // 适配所有文字展示组件。
  function fitAllTextContainers() {
    textContents().forEach((contentEl) => {
      preprocessText(contentEl);
      fitTextElement(contentEl);
    });
  }

  // 让雷达图始终保持 1:1，且根据容器短边自适应尺寸。
  function syncRadarCanvasSize() {
    if (!radarContainer || !radarCanvas) return;
    radarCanvas.style.width = `${radarContainer.clientWidth}px`;
    radarCanvas.style.height = `${radarContainer.clientHeight}px`;
    radarCanvas.width = radarContainer.clientWidth * 1.5;
    radarCanvas.height = radarContainer.clientHeight * 1.5;
    drawRadar(currentScores);
  }

  // 获取所有需要执行入场动画的组件。
  function getEntranceTargets() {
    return layoutPanels().filter((el) => !el.classList.contains('vertical-progress-container'));
  }

  // 清理入场动画状态。
  const entranceAnimationPlayers = new Map();

  function clearEntranceAnimations() {
    entranceAnimationPlayers.forEach((player, el) => {
      try {
        player.cancel();
      } catch (err) {
        // 动画对象失效时忽略。
      }
    });
    entranceAnimationPlayers.clear();

    getEntranceTargets().forEach((el) => {
      el.classList.remove('panel-entering');
      el.classList.remove('panel-enter-fade', 'panel-enter-slide-left', 'panel-enter-slide-right');
      el.style.removeProperty('--entry-delay');
    });
  }



  // 仅用于主图片/主文字组件的默认切换动画（区别于特殊入场动画）。
  function playDefaultSwapAnimation(el) {
    if (!el || dragEnabled) return;

    try {
      el.animate(
              [
                { opacity: 0.45, transform: 'translateY(8px) scale(0.985)', filter: 'blur(1.5px)' },
                { opacity: 1, transform: 'translateY(0) scale(1)', filter: 'blur(0px)' }
              ],
              {
                duration: 380,
                easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
                fill: 'both'
              }
      );
    } catch (err) {
      // 动画能力不可用时忽略。
    }
  }

  function getSlideClassByPosition(el) {
    const rect = el.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    return centerX < window.innerWidth / 2 ? 'panel-enter-slide-left' : 'panel-enter-slide-right';
  }

  function getCurrentTransformMatrix(el) {
    const transformText = getComputedStyle(el).transform;
    if (!transformText || transformText === 'none') return new DOMMatrix();
    return new DOMMatrix(transformText);
  }

  function playSingleEntranceAnimation(el, animClass, delay) {
    const offsetX = animClass === 'panel-enter-slide-left'
            ? -80
            : animClass === 'panel-enter-slide-right'
                    ? 80
                    : 0;

    const targetMatrix = getCurrentTransformMatrix(el);
    const fromMatrix = offsetX === 0 ? targetMatrix : targetMatrix.translate(offsetX, 0);

    const player = el.animate(
            [
              { opacity: 0, transform: fromMatrix.toString() },
              { opacity: 1, transform: targetMatrix.toString() }
            ],
            {
              duration: 800,
              easing: 'ease',
              fill: 'both',
              delay
            }
    );

    entranceAnimationPlayers.set(el, player);
    player.onfinish = () => {
      el.style.opacity = '1';
      el.style.transform = targetMatrix.toString();
      entranceAnimationPlayers.delete(el);
    };
  }

  // 根据当前 data 项配置触发入场动画。
  function playEntranceAnimationsByData(dataItem) {
    // 拖拽模式下会持续依赖 transform 做位移，因此禁用入场动画以避免冲突。
    if (dragEnabled) {
      clearEntranceAnimations();
      return;
    }

    const shouldPlay = dataItem?.playEntranceAnimation === true;  // 改为必须明确为 true
    const hasVerticalTitle = Boolean(dataItem?.title && String(dataItem.title).trim());
    const playVerticalTitleEntrance = () => {
      if (!hasVerticalTitle || !verticalTitleContainer) return;
      playSingleEntranceAnimation(
              verticalTitleContainer,
              getSlideClassByPosition(verticalTitleContainer),
              500
      );
    };

    if (!shouldPlay) {
      clearEntranceAnimations();
      playVerticalTitleEntrance();
      return;
    }

    const radarTargets = getEntranceTargets().filter((el) => el.classList.contains('radar-container'));
    const imageTargets = getEntranceTargets().filter((el) => el.classList.contains('image-display-container'));
    const textTargets = getEntranceTargets().filter((el) =>
            el.classList.contains('text-display-container') &&
            el.id !== 'textDisplayVerticalContainer'
    );
    const rankTargets = getEntranceTargets().filter((el) => el.classList.contains('player-rank-container') || el.classList.contains('player-rank-images-container'));
    const otherTargets = getEntranceTargets().filter((el) =>
            !el.classList.contains('radar-container') &&
            !el.classList.contains('image-display-container') &&
            !el.classList.contains('text-display-container') &&
            !el.classList.contains('player-rank-container') &&
            !el.classList.contains('player-rank-images-container')
    );

    const steps = [
      ...radarTargets.map((el) => ({ el, animClass: 'panel-enter-fade', delay: 0 })),
      ...imageTargets.map((el, idx) => ({
        el,
        animClass: getSlideClassByPosition(el),
        delay: 220 + idx * 120
      })),
      ...textTargets.map((el, idx) => ({
        el,
        animClass: getSlideClassByPosition(el),
        delay: 500 + idx * 120
      })),
      ...rankTargets.map((el, idx) => ({
        el,
        animClass: getSlideClassByPosition(el),
        delay: 500 + (textTargets.length + idx) * 120
      })),
      ...otherTargets.map((el) => ({ el, animClass: 'panel-enter-fade', delay: 0 }))
    ];

    steps.forEach(({ el, animClass, delay }) => {
      playSingleEntranceAnimation(el, animClass, delay);
    });

    playVerticalTitleEntrance();
  }

  // 获取图片组件宽高比（宽/高）。
  function getImagePanelAspectRatio(panelEl) {
    const img = panelEl.querySelector('img');
    if (!img) return 3 / 2;
    const w = img.naturalWidth;
    const h = img.naturalHeight;
    if (w > 0 && h > 0) {
      const ratio = w / h;
      panelEl.dataset.aspectRatio = String(ratio);
      return ratio;
    }
    return parseFloat(panelEl.dataset.aspectRatio) || 3 / 2;
  }

  function syncSingleImagePanelSize(panelEl) {
    const ratio = getImagePanelAspectRatio(panelEl);
    const currentWidth = parseFloat(panelEl.style.width) || panelEl.offsetWidth;
    const heightByRatio = Math.max(snapToGrid(currentWidth / ratio), MIN_PANEL_HEIGHT);
    panelEl.style.height = `${heightByRatio}px`;
  }

  // 初始化所有图片面板比例：以加载后的真实尺寸为准。
  function initImagePanels() {
    imagePanels().forEach((panelEl) => {
      const img = panelEl.querySelector('img');
      if (!img) return;

      if (img.complete) {
        syncSingleImagePanelSize(panelEl);
      } else {
        img.addEventListener('load', () => syncSingleImagePanelSize(panelEl), { once: true });
      }
    });
  }

  function tryLoadImage(img, pathWithoutExt) {
    img.src = `${pathWithoutExt}.png`;

    img.addEventListener('error', function onPngError() {
      // PNG 不存在，尝试 JPG
      img.removeEventListener('error', onPngError);
      img.src = `${pathWithoutExt}.jpg`;
    }, { once: true });
  }

  // 跟随 data 切换：同步前两个图片组件与前两个横版文字组件内容。
  function updateDynamicDisplayByData() {
    const current = DATA[currentIndex];
    const playerNameText = current?.name || "";
    const playerTeamText = current?.teamname || "";
    const shouldUseDefaultSwapAnimation = !dragEnabled && current?.playEntranceAnimation !== true
            && current?.noAnimation !== true;
    const verticalTitle = current?.title ? String(current.title).trim() : "";

    const images = imageDisplayImages();

    if (images[0]) {
      const basePath = `./pic/${playerNameText}/1`;
      tryLoadImage(images[0], basePath);

      images[0].addEventListener('load', () => {
        const panel = images[0].closest('.image-display-container');
        if (panel) syncSingleImagePanelSize(panel);

        if (shouldUseDefaultSwapAnimation) {
          const target = panel
                  ? panel.querySelector('.image-display-content')
                  : images[0];
          playDefaultSwapAnimation(target);
        }
      }, { once: true });
    }

    if (images[1]) {
      const basePath = `./pic/${playerNameText}/2`;
      tryLoadImage(images[1], basePath);

      images[1].addEventListener('load', () => {
        const panel = images[1].closest('.image-display-container');
        if (panel) syncSingleImagePanelSize(panel);
      }, { once: true });
    }

    const horizontalTexts = horizontalTextContents();
    if (horizontalTexts[0]) {
      horizontalTexts[0].dataset.rawText = playerNameText;
      horizontalTexts[0].textContent = playerNameText;
      if (shouldUseDefaultSwapAnimation) playDefaultSwapAnimation(horizontalTexts[0]);
    }
    if (horizontalTexts[1]) {
      horizontalTexts[1].dataset.rawText = playerTeamText;
      horizontalTexts[1].textContent = playerTeamText;
    }

    if (verticalTitleContainer && verticalTitleContent) {
      if (verticalTitle) {
        verticalTitleContainer.style.display = "";
        verticalTitleContent.dataset.rawText = verticalTitle;
        verticalTitleContent.textContent = verticalTitle;
        if (shouldUseDefaultSwapAnimation) playDefaultSwapAnimation(verticalTitleContent);
      } else {
        verticalTitleContainer.style.display = "none";
      }
    }

    fitAllTextContainers();
  }

  // 初始化底部“选手统计项”DOM。
  function initPlayerStats() {
    // 清空容器，避免重复初始化导致项目叠加。
    playerStats.innerHTML = '';
    // 按每个维度动态创建统计块。
    CONFIG.DIM_NAMES.forEach((dim, i) => {
      const statItem = document.createElement('div');
      statItem.className = 'stat-item';
      statItem.innerHTML = `
        <div class="stat-label">${dim}</div>
        <div class="stat-value" id="stat-${i}">0</div>
      `;
      playerStats.appendChild(statItem);
    });
    // 首次渲染数值。
    updatePlayerStats();
    updatePlayerRanks();
  }

  // 用 currentScores 刷新底部统计值。
  function updatePlayerStats() {
    CONFIG.DIM_NAMES.forEach((dim, i) => {
      const statEl = document.getElementById(`stat-${i}`);
      if (statEl) {
        const value = currentScores[i];
        // 统一格式：数字保留两位小数，非数字原样显示。
        statEl.textContent = typeof value === 'number' ? value.toFixed(2) : value;
      }
    });
  }


  function initPlayerRankImages() {
    if (!playerRankImages) return;
    playerRankImages.innerHTML = '';
    const stageCount = Math.max(CONFIG.RANK_STAGE_NAMES.length, 4);
    playerRankImages.style.gridTemplateColumns = `repeat(${stageCount}, 1fr)`;

    for (let i = 0; i < stageCount; i += 1) {
      const item = document.createElement('div');
      item.className = 'player-rank-image-item';
      item.innerHTML = `<img id="rank-image-${i}" src="./pic/1.jpg" alt="阶段图片${i + 1}" />`;
      playerRankImages.appendChild(item);
    }
    updatePlayerRankImages();
  }

  function updatePlayerRankImages(withAnimation = false) {
    if (!playerRankImages) return;
    const current = DATA[currentIndex] || {};
    const ranks = Array.isArray(current.rank) ? current.rank : [];
    const stageCount = Math.max(CONFIG.RANK_STAGE_NAMES.length, 4);

    for (let i = 0; i < stageCount; i += 1) {
      const imgEl = document.getElementById(`rank-image-${i}`);
      if (!imgEl) continue;
      const rankVal = ranks[i] ?? '-';
      imgEl.alt = `阶段${i + 1} 排名 ${rankVal}`;
      imgEl.src = `./pic/${i + 1}r.png`;
    }

    if (withAnimation) {
      playDefaultSwapAnimation(playerRankImages);
    }
  }

  function initPlayerRanks() {
    if (!playerRanks) return;
    playerRanks.innerHTML = '';
    CONFIG.RANK_STAGE_NAMES.forEach((label, i) => {
      const rankItem = document.createElement('div');
      rankItem.className = 'stat-item';
      rankItem.innerHTML = `
        <div class="stat-label">${label}</div>
        <div class="stat-value" id="rank-${i}">-</div>
      `;
      playerRanks.appendChild(rankItem);
    });
    updatePlayerRanks();
  }

  function updatePlayerRanks(withAnimation = false) {
    if (!playerRanks) return;
    const current = DATA[currentIndex] || {};
    const ranks = Array.isArray(current.rank) ? current.rank : [];
    const totals = Array.isArray(CONFIG.RANK_STAGE_TOTALS) ? CONFIG.RANK_STAGE_TOTALS : [];
    const stageCount = Math.max(CONFIG.RANK_STAGE_NAMES.length, 4);

    var rankMainClass;
    for (let i = 0; i < stageCount; i += 1) {
      const rankEl = document.getElementById(`rank-${i}`);
      if (!rankEl) continue;
      const rankVal = ranks[i];
      const total = totals[i];
      const hasRank = rankVal !== undefined && rankVal !== null;
      const hasTotal = typeof total === 'number' && Number.isFinite(total);
      const rankMain = hasRank && rankVal !== 0 ? String(rankVal) : '-';
      const rankTotal = hasTotal ? String(total) : '-';
      rankMainClass = 'rank-main';
      if (String(rankVal) === '1') {
        rankMainClass = 'rank-main rank-mainG';
      }
      if (String(rankVal) === '2') {
        rankMainClass = 'rank-main rank-mainS';
      }
      if (String(rankVal) === '3') {
        rankMainClass = 'rank-main rank-mainB';
      }


      rankEl.innerHTML = `
        <span class="${rankMainClass}">${rankMain}</span>
        <span class="rank-total">/ ${rankTotal}</span>
      `;
    }

    if (withAnimation) {
      playDefaultSwapAnimation(playerRanks);
    }
  }

  // 在 canvas 上绘制当前雷达图。
  function drawRadar(scores) {
    // 画布宽高
    const w = radarCanvas.width;
    const h = radarCanvas.height;
    // 圆心坐标。
    const cx = w / 2;
    const cy = h / 2;
    // 最大半径（取短边 * 系数，留边距）。
    const maxR = Math.min(w, h) * 0.33;
    // 维度个数。
    const n = CONFIG.DIM_NAMES.length;

    // 清空上一帧图像。
    ctx.clearRect(0, 0, w, h);

    // 绘制多层背景网格。
    ctx.strokeStyle = "rgba(255,255,255,0.20)";
    ctx.lineWidth = 2;
    for (let level = 1; level <= CONFIG.GRID_LEVELS; level++) {
      // 当前层半径按层级线性递增。
      const r = (maxR * level) / CONFIG.GRID_LEVELS;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        // 将每个维度换算成极角（从正上方开始顺时针）。
        const a = (-Math.PI / 2) + (i * 2 * Math.PI / n);
        // 极坐标转直角坐标。
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    }

    // 绘制从圆心到每个维度端点的轴线。
    for (let i = 0; i < n; i++) {
      const a = (-Math.PI / 2) + (i * 2 * Math.PI / n);
      const x = cx + Math.cos(a) * maxR;
      const y = cy + Math.sin(a) * maxR;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(x, y);
      ctx.stroke();
    }

    // 绘制均值轮廓（红色描边、无填充），默认显示在变化数据下方。
    const hideAvgShape = DATA[currentIndex]?.hideAvg === true;
    if (!hideAvgShape) {
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const a = (-Math.PI / 2) + (i * 2 * Math.PI / n);
        const r = maxR * normalize(CONFIG.AVG_SCORES[i], i);
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = "rgba(255, 74, 74, 0.95)";
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    // 绘制实际数据多边形。
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = (-Math.PI / 2) + (i * 2 * Math.PI / n);
      // 分数先归一化，再换算为半径。
      const r = maxR * normalize(scores[i], i);
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    // 设置填充/描边风格并绘制。
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    ctx.strokeStyle = "rgba(255,255,255,0.90)";
    ctx.lineWidth = 3;
    ctx.fill();
    ctx.stroke();

    // 绘制标签+数据：位置会根据象限自动调整，颜色按当前分值动态变化。

    for (let i = 0; i < n; i++) {
      const valueR =  Math.max(maxR, maxR * normalize(scores[i], i)) + 50;
      const a = (-Math.PI / 2) + (i * 2 * Math.PI / n);
      const cosA = Math.cos(a);
      const sinA = Math.sin(a);
      const labelX = cx + cosA * valueR;
      const labelY = cy + sinA * valueR + 20;
      const valueX = cx + cosA * valueR;
      const valueY = cy + sinA * valueR - 20;
      const norm = normalize(scores[i], i);
      const textColor = getRadarLabelColor(norm);

      if (Math.abs(cosA) < 0.2) ctx.textAlign = "center";
      else ctx.textAlign = cosA > 0 ? "left" : "right";
      if (Math.abs(sinA) < 0.2) ctx.textBaseline = "middle";
      else ctx.textBaseline = sinA > 0 ? "top" : "bottom";

      // 维度标签。
      ctx.font = "600 36px 'PingFang SC', 'Microsoft YaHei', sans-serif";
      ctx.fillStyle = textColor;
      ctx.fillText(CONFIG.DIM_NAMES[i], labelX, labelY);

      // 维度实时值。
      ctx.font = "500 28px 'JetBrains Mono', 'Consolas', monospace";
      ctx.fillStyle = textColor;
      ctx.fillText(formatRadarValue(scores[i], i), valueX, valueY);
    }
  }

  // 主动画循环：由 requestAnimationFrame 持续驱动。
  function tick(ts) {
    // 未开始或已暂停时直接退出，不进入后续计算。
    if (!started || isPaused) return;
    // 进入阶段的第一帧，记录阶段起始时间。
    if (!phaseStart) phaseStart = ts;

    // 当前选手对象。
    const current = DATA[currentIndex];
    // 当前选手展示时长。
    const currentDuration = current.duration || CONFIG.DEFAULT_DURATION;
    // 当前阶段已过去时间。
    const t = ts - phaseStart;

    // show：展示当前选手数据（在切换到新 data 后前一段时间做雷达图形变）。
    if (phase === "show") {
      // 当前选手进度（0~1）。
      const p = clamp(t / currentDuration, 0, 1);
      itemBar.style.width = `${(p * 100).toFixed(2)}%`;
      if (itemBarVertical) itemBarVertical.style.height = `${(p * 100).toFixed(2)}%`;
      // 全局进度 = (此前累计 + 当前展示已走部分) / 全时长。
      const globalProgress = (elapsedBeforeCurrent + p * currentDuration) / totalTimeline;
      globalBar.style.width = `${(globalProgress * 100).toFixed(2)}%`;
      if (globalBarVertical) globalBarVertical.style.height = `${(globalProgress * 100).toFixed(2)}%`;

      if (isMorphing) {
        const morphProgress = clamp((ts - morphStart) / CONFIG.TRANSITION_MS, 0, 1);
        const eased = easeInOutCubic(morphProgress);
        currentScores = fromScores.map((v, i) => lerp(v, toScores[i], eased));
        if (morphProgress >= 1) {
          isMorphing = false;
          currentScores = [...current.points];
        }
      } else {
        currentScores = [...current.points];
      }

      // 当前选手展示完成后，直接切换到下一个 data，并从切换时刻开始形变。
      if (t >= currentDuration) {
        const previous = DATA[currentIndex];
        elapsedBeforeCurrent += currentDuration;
        currentIndex = (currentIndex + 1) % DATA.length;
        // 完成一整轮时，累计时长回到 0，保证全局进度从头开始。
        if (currentIndex === 0) elapsedBeforeCurrent = 0;

        fromScores = DATA[currentIndex].playEntranceAnimation === true
                ? getMinScoreBaseline()
                : [...previous.points];
        toScores = [...DATA[currentIndex].points];
        isMorphing = true;
        morphStart = ts;
        currentScores = [...fromScores];

        phaseStart = ts;
        updatePlayerInfo();
        // 组件入场动画与雷达图形变在切换 data 的同一时刻开始。
        playEntranceAnimationsByData(DATA[currentIndex]);
      }
    }

    // 每帧都同步更新统计面板和雷达图。
    updatePlayerStats();
    drawRadar(currentScores);
    // 请求下一帧。
    requestAnimationFrame(tick);
  }

  // 同步显示“当前选手姓名”。
  function updatePlayerInfo() {
    const current = DATA[currentIndex];
    playerName.textContent = current.name;
    updateDynamicDisplayByData();
    const shouldUseDefaultSwapAnimation = !dragEnabled && current?.playEntranceAnimation !== true
            && current?.noAnimation !== true;
    updatePlayerRanks(shouldUseDefaultSwapAnimation);
    updatePlayerRankImages(shouldUseDefaultSwapAnimation);
    // currentPlayerLabel.textContent = current.name;
  }

  // 跳转到指定下标的选手（用于上一位/下一位按钮）。
  function goToPlayer(index) {
    // 处理越界：小于 0 跳到最后一个，大于等于长度跳到第一个。
    if (index < 0) index = DATA.length - 1;
    if (index >= DATA.length) index = 0;

    // 更新当前索引并回到 show 阶段。
    currentIndex = index;
    phase = "show";
    // 将阶段起点清零，等待下一帧重新赋值。
    phaseStart = 0;

    // 重新计算该选手前面的累计时长。
    let total = 0;
    for (let i = 0; i < index; i++) {
      total += DATA[i].duration || CONFIG.DEFAULT_DURATION;
    }
    elapsedBeforeCurrent = total;

    // 立即刷新当前分数与界面显示。
    const targetData = DATA[currentIndex];
    const shouldPlayEntrance = targetData.playEntranceAnimation === true;
    currentScores = shouldPlayEntrance ? getMinScoreBaseline() : [...targetData.points];
    isMorphing = shouldPlayEntrance;
    morphStart = shouldPlayEntrance ? performance.now() : 0;
    fromScores = shouldPlayEntrance ? getMinScoreBaseline() : [...targetData.points];
    toScores = [...DATA[currentIndex].points];
    updatePlayerInfo();
    updatePlayerStats();
    drawRadar(currentScores);
    playEntranceAnimationsByData(DATA[currentIndex]);

    // 刷新进度条：当前项从 0% 开始，全局进度定位到累计位置。
    const current = DATA[currentIndex];
    const currentDuration = current.duration || CONFIG.DEFAULT_DURATION;
    const globalProgress = elapsedBeforeCurrent / totalTimeline;
    itemBar.style.width = "0%";
    if (itemBarVertical) itemBarVertical.style.height = "0%";
    globalBar.style.width = `${(globalProgress * 100).toFixed(2)}%`;
    if (globalBarVertical) globalBarVertical.style.height = `${(globalProgress * 100).toFixed(2)}%`;
    // globalProgressLabel.textContent = `${(globalProgress * 100).toFixed(1)}%`;
  }

  // 初始化 Interact.js：为所有布局面板绑定拖拽和右下角缩放能力。
  function initInteract() {
    const draggableElements = layoutPanels();

    draggableElements.forEach(element => {
      // 启用拖拽。
      interact(element)
              .draggable({
                enabled: dragEnabled,
                modifiers: [
                  interact.modifiers.snap({
                    targets: [
                      interact.createSnapGrid({ x: SNAP_GRID_SIZE, y: SNAP_GRID_SIZE })
                    ],
                    range: Infinity,
                    relativePoints: [{ x: 0, y: 0 }]
                  })
                ],
                listeners: {
                  start(event) {
                    if (!dragEnabled) return;
                    // 拖拽开始时置顶，并保持在最上层。
                    bringPanelToFront(event.target);
                  },
                  move(event) {
                    if (!dragEnabled) return;
                    const target = event.target;
                    // 读取历史偏移并叠加本次位移增量。
                    const rawX = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
                    const rawY = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
                    const x = snapToGrid(rawX);
                    const y = snapToGrid(rawY);

                    // 用 transform 平移元素。
                    target.style.transform = `translate(${x}px, ${y}px)`;
                    // 把当前位置写回 data-* 属性，供下一次拖拽继续累加。
                    target.setAttribute('data-x', x);
                    target.setAttribute('data-y', y);
                  },
                  end() {}
                }
              })
              // 启用缩放：只允许右边和下边改变尺寸。
              .resizable({
                edges: { left: false, right: true, bottom: true, top: false },
                listeners: {
                  move(event) {
                    if (!dragEnabled) return;
                    const target = event.target;
                    // 缩放时同样置顶，避免边缘被其他组件覆盖。
                    bringPanelToFront(target);
                    let { width, height } = event.rect;

                    // 统一限制最小尺寸，避免内容被压扁不可读。
                    width = Math.max(width, MIN_PANEL_WIDTH);
                    height = Math.max(height, MIN_PANEL_HEIGHT);

                    // 尺寸吸附到网格。
                    width = snapToGrid(width);
                    height = snapToGrid(height);
                    width = Math.max(width, MIN_PANEL_WIDTH);
                    height = Math.max(height, MIN_PANEL_HEIGHT);

                    if (target.id === 'radarContainer') {
                      target.style.width = `${width}px`;
                      target.style.height = `${height}px`;
                      syncRadarCanvasSize();
                      return;
                    }

                    // 图片展示面板按图片真实比例缩放。
                    if (target.classList.contains('image-display-container')) {
                      const imageAspectRatio = getImagePanelAspectRatio(target);
                      let snappedWidth = width;
                      let snappedHeight = snapToGrid(width / imageAspectRatio);

                      if (snappedHeight < MIN_PANEL_HEIGHT) {
                        snappedHeight = MIN_PANEL_HEIGHT;
                        snappedWidth = snapToGrid(snappedHeight * imageAspectRatio);
                      }

                      snappedWidth = Math.max(snappedWidth, MIN_PANEL_WIDTH);
                      snappedHeight = Math.max(snapToGrid(snappedWidth / imageAspectRatio), MIN_PANEL_HEIGHT);
                      target.style.width = `${snappedWidth}px`;
                      target.style.height = `${snappedHeight}px`;
                      return;
                    }

                    target.style.width = `${width}px`;
                    target.style.height = `${height}px`;
                    if (target.classList.contains('text-display-container')) {
                      const contentEl = target.querySelector('.text-display-content');
                      if (contentEl) fitTextElement(contentEl);
                    }
                  }
                },
                // 再加一层库级别的尺寸限制保护。
                modifiers: [
                  // 拖拽/缩放都吸附到固定网格。
                  interact.modifiers.snapSize({
                    targets: [
                      interact.createSnapGrid({ x: SNAP_GRID_SIZE, y: SNAP_GRID_SIZE })
                    ]
                  }),
                  interact.modifiers.restrictSize({
                    min: { width: MIN_PANEL_WIDTH, height: MIN_PANEL_HEIGHT }
                  })
                ]
              });
    });
  }

  // 收集当前面板布局信息（位置+尺寸）。
  function collectLayoutState() {
    const state = {};
    layoutPanels().forEach((el) => {
      const key = el.dataset.panelKey;
      if (!key) return;
      state[key] = {
        x: parseFloat(el.getAttribute("data-x")) || 0,
        y: parseFloat(el.getAttribute("data-y")) || 0,
        width: el.style.width || `${el.offsetWidth}px`,
        height: el.style.height || `${el.offsetHeight}px`
      };
    });
    return state;
  }

  // 将布局状态写入 localStorage。
  function saveLayoutState() {
    const state = collectLayoutState();
    localStorage.setItem(LAYOUT_STORAGE_KEY, JSON.stringify(state));
  }

  // 导出当前布局为 Layout.json 文件。
  function exportLayoutState() {
    const state = collectLayoutState();
    const json = JSON.stringify(state, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Layout.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // 从 Layout.json 内容导入布局。
  function importLayoutState(state) {
    if (!state || typeof state !== 'object') return;
    applyLayoutState(state);
    saveLayoutState();
  }

  // 解析并导入拖入的 Layout.json 文件。
  async function importLayoutFile(file) {
    if (!file) return;
    const fileName = file.name.toLowerCase();
    const isJsonType = file.type === 'application/json' || fileName.endsWith('.json');
    if (!isJsonType) return;

    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      importLayoutState(parsed);
    } catch (err) {
      // 导入失败时静默忽略，避免中断主流程。
    }
  }

  // 将保存过的布局状态应用到页面。
  function applyLayoutState(state) {
    layoutPanels().forEach((el) => {
      const key = el.dataset.panelKey;
      if (!key) return;
      const panelState = state[key];
      if (!panelState) return;
      const x = Number.isFinite(panelState.x) ? panelState.x : 0;
      const y = Number.isFinite(panelState.y) ? panelState.y : 0;
      el.style.transform = `translate(${x}px, ${y}px)`;
      el.setAttribute("data-x", x);
      el.setAttribute("data-y", y);
      if (panelState.width) el.style.width = panelState.width;
      if (panelState.height) el.style.height = panelState.height;
    });

    fitAllTextContainers();
    syncRadarCanvasSize();
  }

  // 页面初始化时尝试恢复布局。
  function loadLayoutState() {
    const saved = localStorage.getItem(LAYOUT_STORAGE_KEY);
    if (!saved) return;
    try {
      const parsed = JSON.parse(saved);
      applyLayoutState(parsed);
    } catch (err) {
      localStorage.removeItem(LAYOUT_STORAGE_KEY);
    }
  }

  // 把所有面板恢复到初始位置和尺寸。
  function resetLayout() {
    layoutPanels().forEach((panel) => {
      panel.style.transform = 'translate(0px, 0px)';
      panel.setAttribute('data-x', 0);
      panel.setAttribute('data-y', 0);

      const defaultWidth = parseFloat(panel.dataset.defaultWidth);
      const defaultHeight = parseFloat(panel.dataset.defaultHeight);
      if (Number.isFinite(defaultWidth)) panel.style.width = `${defaultWidth}px`;
      if (Number.isFinite(defaultHeight)) panel.style.height = `${defaultHeight}px`;

      if (panel.classList.contains('image-display-container')) {
        const ratio = getImagePanelAspectRatio(panel);
        const width = parseFloat(panel.style.width) || panel.offsetWidth;
        const height = Math.max(snapToGrid(width / ratio), MIN_PANEL_HEIGHT);
        panel.style.height = `${height}px`;
      }
    });

    fitAllTextContainers();
    syncRadarCanvasSize();

    // 重置后立刻覆盖保存布局，保证下次进入也是重置态。
    saveLayoutState();
  }

  // 切换拖拽模式：允许拖动/固定布局。
  function toggleDragMode() {
    dragEnabled = !dragEnabled;
    // 用 active 样式表达当前是否处于拖拽模式，不改按钮文案。
    toggleDragBtn.classList.toggle('active', dragEnabled);

    // 动态更新所有面板的 draggable 配置。
    layoutPanels().forEach(element => {
      interact(element).draggable({ enabled: dragEnabled });
    });

    // 当切换到固定模式时，记录当前布局用于下次加载恢复。
    if (!dragEnabled) {
      saveLayoutState();
      playEntranceAnimationsByData(DATA[currentIndex]);
    } else {
      clearEntranceAnimations();
    }
  }

  // 切换右上角功能按钮显隐。
  function toggleLayoutControlsVisibility() {
    if (!layoutControlsContainer) return;
    layoutControlsContainer.classList.toggle('hidden');
  }

  // 键盘监听：仅在首次按下空格时开始播放。
  window.addEventListener("keydown", (e) => {
    if (e.code !== "Space") return;
    // 阻止空格触发页面滚动等默认行为。
    e.preventDefault();
    if (!started && !startPending) {
      startPending = true;
      // 首次按下空格后等待 10 秒，再启动主循环。
      introOverlay.classList.add("started");
      started = true;
      startPending = false;
      requestAnimationFrame(tick);
    }
    else{
      toggleLayoutControlsVisibility();
    }
  });

  // // 播放按钮：在暂停与继续之间切换。
  // playBtn.addEventListener("click", () => {
  //   isPaused = !isPaused;
  //   playBtn.textContent = isPaused ? "继续播放" : "暂停播放";
  //   // 从暂停恢复时，重新请求下一帧。
  //   if (!isPaused && started) {
  //     requestAnimationFrame(tick);
  //   }
  // });
  //
  // // 上一个：跳到前一位选手。
  // prevBtn.addEventListener("click", () => {
  //   goToPlayer(currentIndex - 1);
  // });
  //
  // // 下一个：跳到后一位选手。
  // nextBtn.addEventListener("click", () => {
  //   goToPlayer(currentIndex + 1);
  // });

  // 绑定布局按钮事件。
  resetLayoutBtn.addEventListener("click", resetLayout);
  toggleDragBtn.addEventListener("click", toggleDragMode);
  exportLayoutBtn.addEventListener("click", exportLayoutState);

  // 在拖拽模式下支持拖入 Layout.json 更新布局。
  window.addEventListener('dragover', (e) => {
    if (!dragEnabled) return;
    e.preventDefault();
  });

  window.addEventListener('drop', async (e) => {
    if (!dragEnabled) return;
    e.preventDefault();
    const file = e.dataTransfer?.files?.[0];
    await importLayoutFile(file);
  });

  // 页面初始化入口：先渲染默认数据，再挂载交互。
  function init() {
    ensurePanelKeys();
    initHighestPanelZIndex();
    initImagePanels();
    // 优先恢复上次保存的布局（若存在）。
    loadLayoutState();
    syncRadarCanvasSize();
    drawRadar(DATA[0].points);
    initPlayerStats();
    initPlayerRanks();
    initPlayerRankImages();
    updatePlayerInfo();
    initInteract();
    layoutPanels().forEach((panel) => {
      panel.addEventListener('pointerdown', () => bringPanelToFront(panel));
    });
    fitAllTextContainers();
    playEntranceAnimationsByData(DATA[currentIndex]);
  }

  // DOM 树加载完成后执行初始化。
  window.addEventListener('DOMContentLoaded', init);
  window.addEventListener('resize', () => {
    fitAllTextContainers();
    syncRadarCanvasSize();
  });
</script>
